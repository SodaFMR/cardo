name: ci

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # CI-only: local.properties is absent on the runner, so AGP locates the SDK through
      # ANDROID_HOME, which setup-android exports. The platform and build-tools are not
      # preinstalled at these versions, so install them explicitly.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      # settings.gradle.kts downloads the pinned sherpa-onnx AAR into this cache on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cardo-artifacts
          key: cardo-artifacts-${{ hashFiles('artifacts.lock.json') }}

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build --stacktrace
